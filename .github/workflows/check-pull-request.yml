name: Check pull requests

on: [workflow_dispatch]

jobs:

  check:
    runs-on: ubuntu-latest
    container:
      image: archlinux

    permissions:
      pull-requests: write

    steps:
      - uses: arch4edu/cactus/actions/upgrade-archlinux@37ded11ba01d3e1cba8114b2797d88bfa4b0218b # main

      - name: Install runtime dependencies
        run: pacman -S --noconfirm --needed git nvchecker python-requests python-toml

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Check nvchecker.toml
        run: |
          git config --global --add safe.directory $(realpath .)
          sed "s/__GITHUB_TOKEN__/${{ secrets.GITHUB_TOKEN}}/" -i config/keyfile.toml
          python check-pr.py
